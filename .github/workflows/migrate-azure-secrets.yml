name: Migrate Azure secrets to Key Vault

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      API_APP: ${{ vars.AZURE_API_APP }}
      FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
      INGEST_JOB: ${{ vars.AZURE_INGEST_JOB }}
      KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      RUNTIME_IDENTITY_ID: ${{ vars.AZURE_RUNTIME_IDENTITY_ID }}
    steps:
      - name: Checkout approved runbook
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate secret migration prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VAULT_NAME"
          test -n "$RUNTIME_IDENTITY_ID"
          az keyvault show --name "$KEY_VAULT_NAME" \
            --query properties.enableRbacAuthorization -o tsv | grep -qx true
          az identity show --ids "$RUNTIME_IDENTITY_ID" \
            --query principalId -o tsv > artifacts/runtime-identity-principal-id.txt

      - name: Migrate active secrets
        shell: bash
        run: |
          set -euo pipefail
          VAULT_URI=$(az keyvault show --name "$KEY_VAULT_NAME" --query properties.vaultUri -o tsv)
          migrate_secret() {
            local app_name="$1"
            local source_name="$2"
            local vault_name="$3"
            local value
            value=$(az containerapp secret show --resource-group "$RESOURCE_GROUP" \
              --name "$app_name" --secret-name "$source_name" --query value -o tsv)
            test -n "$value"
            az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name "$vault_name" \
              --value "$value" --output none
          }
          migrate_secret "$API_APP" jwt-secret jwt-secret
          migrate_secret "$API_APP" opencode-api-key opencode-api-key
          migrate_secret "$API_APP" langsmith-api-key langsmith-api-key
          migrate_secret "$API_APP" database-url database-url

          validate_ingest_job_identity() {
            local expected_principal_id
            expected_principal_id=$(az identity show --ids "$RUNTIME_IDENTITY_ID" \
              --query principalId -o tsv)
            az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$INGEST_JOB" \
              --query identity.userAssignedIdentities -o json |
              jq -e --arg principal_id "$expected_principal_id" \
                'to_entries | any(.value.principalId == $principal_id)' > /dev/null
          }

          az containerapp identity assign --resource-group "$RESOURCE_GROUP" --name "$API_APP" \
            --user-assigned "$RUNTIME_IDENTITY_ID" --output none
          az containerapp identity assign --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP" \
            --user-assigned "$RUNTIME_IDENTITY_ID" --output none
          if ! validate_ingest_job_identity; then
            if ! az containerapp job identity assign --resource-group "$RESOURCE_GROUP" \
              --name "$INGEST_JOB" --user-assigned "$RUNTIME_IDENTITY_ID" --output none; then
              echo "::warning::Azure CLI returned non-zero after job identity assignment; validating ARM state."
            fi
            validate_ingest_job_identity
          fi
          az containerapp registry set --resource-group "$RESOURCE_GROUP" --name "$API_APP" \
            --server "${ACR_NAME}.azurecr.io" --identity "$RUNTIME_IDENTITY_ID" --output none
          az containerapp registry set --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP" \
            --server "${ACR_NAME}.azurecr.io" --identity "$RUNTIME_IDENTITY_ID" --output none
          az containerapp job registry set --resource-group "$RESOURCE_GROUP" --name "$INGEST_JOB" \
            --server "${ACR_NAME}.azurecr.io" --identity "$RUNTIME_IDENTITY_ID" --output none
          az containerapp secret set --resource-group "$RESOURCE_GROUP" --name "$API_APP" --secrets \
            "jwt-secret=keyvaultref:${VAULT_URI}secrets/jwt-secret,identityref:${RUNTIME_IDENTITY_ID}" \
            "opencode-api-key=keyvaultref:${VAULT_URI}secrets/opencode-api-key,identityref:${RUNTIME_IDENTITY_ID}" \
            "langsmith-api-key=keyvaultref:${VAULT_URI}secrets/langsmith-api-key,identityref:${RUNTIME_IDENTITY_ID}" \
            "database-url=keyvaultref:${VAULT_URI}secrets/database-url,identityref:${RUNTIME_IDENTITY_ID}" \
            --output none
          az containerapp secret remove --resource-group "$RESOURCE_GROUP" --name "$API_APP" \
            --secret-names registry-password --output none
          az containerapp secret remove --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP" \
            --secret-names registry-password --output none
          az containerapp job secret remove --resource-group "$RESOURCE_GROUP" --name "$INGEST_JOB" \
            --secret-names registry-password --yes --output none

      - name: Restart migrated API revision
        shell: bash
        run: |
          set -euo pipefail
          API_REVISION=$(az containerapp show --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP" --query properties.latestRevisionName -o tsv)
          az containerapp revision restart --resource-group "$RESOURCE_GROUP" --name "$API_APP" \
            --revision "$API_REVISION" --output none

      - name: Smoke test migrated deployment
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error --retry 12 --retry-delay 10 \
            "https://$FRONTEND_FQDN/health" > artifacts/health.json

      - name: Disable legacy ACR admin
        shell: bash
        run: az acr update --name "$ACR_NAME" --admin-enabled false --output none

      - name: Write migration evidence
        if: always()
        shell: bash
        run: |
          jq -n \
            --arg github_sha "$GITHUB_SHA" \
            --arg workflow_run "$GITHUB_RUN_ID" \
            --arg key_vault "$KEY_VAULT_NAME" \
            --arg runtime_identity "$RUNTIME_IDENTITY_ID" \
            '{
              schema_version: "1.0.0",
              github_sha: $github_sha,
              workflow_run: $workflow_run,
              key_vault: $key_vault,
              runtime_identity: $runtime_identity
            }' > artifacts/secret-migration-evidence.json

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-secret-migration-evidence
          path: artifacts/
          if-no-files-found: error
