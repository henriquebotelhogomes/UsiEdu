name: UsiEdu AI Quality & Test Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-quality-gate:
    name: Lint, Test & RAG Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 1. Code Style & Lint (Ruff)
        run: |
          ruff check src/ tests/ scripts/

      - name: 2. Automated Unit Tests (Pytest)
        run: |
          pytest tests/unit/ -v --cov=src

      - name: 3. RAG Quality Gate (Regression Gate)
        run: |
          python -m src.evaluation.regression_gate \
            --baseline src/evaluation/regression_fixtures/baseline.json \
            --candidate src/evaluation/regression_fixtures/candidate.json \
            --policy src/evaluation/regression_policy_v1.json \
            --output rag-regression-report.json

      - name: 4. Multi-Agent Loop & Trajectory Gate (Agent Harness)
        run: |
          python scripts/run_harness.py --suite all --ci-gate --min-pass-rate 0.90
