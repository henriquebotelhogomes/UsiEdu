name: Exercise Azure recovery

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      RECOVERY_RESOURCE_GROUP: ${{ vars.AZURE_RECOVERY_RESOURCE_GROUP }}
      SOURCE_POSTGRES_SERVER: ${{ vars.AZURE_POSTGRES_SERVER }}
      RECOVERY_POSTGRES_SERVER: ${{ vars.AZURE_RECOVERY_POSTGRES_SERVER }}
      STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      SOURCE_SHARE: qdrant
    steps:
      - name: Checkout approved runbook
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate isolated recovery prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RECOVERY_RESOURCE_GROUP"
          test -n "$RECOVERY_POSTGRES_SERVER"
          test -n "$STORAGE_ACCOUNT"
          test -n "$KEY_VAULT_NAME"
          test "$RECOVERY_RESOURCE_GROUP" != "$RESOURCE_GROUP"
          test "$RECOVERY_POSTGRES_SERVER" != "$SOURCE_POSTGRES_SERVER"
          az group show --name "$RECOVERY_RESOURCE_GROUP" --output none
          az postgres flexible-server show --resource-group "$RESOURCE_GROUP" \
            --name "$SOURCE_POSTGRES_SERVER" --output none
          az storage account show --resource-group "$RESOURCE_GROUP" \
            --name "$STORAGE_ACCOUNT" --output none
          az storage share-rm show --resource-group "$RESOURCE_GROUP" \
            --storage-account "$STORAGE_ACCOUNT" --name "$SOURCE_SHARE" --output none

      - name: Restore isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          test "$RECOVERY_POSTGRES_SERVER" != "$SOURCE_POSTGRES_SERVER"
          RESTORE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for attempt in 1 2; do
            if az postgres flexible-server restore \
              --resource-group "$RECOVERY_RESOURCE_GROUP" \
              --name "$RECOVERY_POSTGRES_SERVER" \
              --source-server "/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${SOURCE_POSTGRES_SERVER}" \
              --yes \
              --output none; then
              break
            fi
            if test "$attempt" -eq 2; then
              exit 1
            fi
            sleep 30
          done
          RESTORE_COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "RESTORE_STARTED_AT=$RESTORE_STARTED_AT"
            echo "RESTORE_COMPLETED_AT=$RESTORE_COMPLETED_AT"
          } >> "$GITHUB_ENV"

      - name: Snapshot and clone Qdrant share
        shell: bash
        run: |
          set -euo pipefail
          QDRANT_SNAPSHOT=$(az storage share-rm snapshot \
            --resource-group "$RESOURCE_GROUP" \
            --storage-account "$STORAGE_ACCOUNT" \
            --name "$SOURCE_SHARE" \
            --query snapshotTime -o tsv)
          RECOVERY_SHARE="qdrant-recovery-${GITHUB_RUN_ID}"
          {
            echo "QDRANT_SNAPSHOT=$QDRANT_SNAPSHOT"
            echo "RECOVERY_SHARE=$RECOVERY_SHARE"
          } >> "$GITHUB_ENV"
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query '[0].value' -o tsv)
          command -v azcopy > /dev/null
          python -m pip install --quiet azure-storage-file-share==12.23.0
          SOURCE_SAS=$(STORAGE_ACCOUNT="$STORAGE_ACCOUNT" \
            STORAGE_KEY="$STORAGE_KEY" \
            python -c 'import os; from datetime import datetime, timedelta, timezone; from azure.storage.fileshare import AccountSasPermissions, ResourceTypes, Services, generate_account_sas; print(generate_account_sas(account_name=os.environ["STORAGE_ACCOUNT"], account_key=os.environ["STORAGE_KEY"], resource_types=ResourceTypes(container=True, object=True), permission=AccountSasPermissions(read=True, list=True), expiry=datetime.now(timezone.utc) + timedelta(hours=1), services=Services(fileshare=True), protocol="https"))')
          DESTINATION_SAS=$(STORAGE_ACCOUNT="$STORAGE_ACCOUNT" \
            STORAGE_KEY="$STORAGE_KEY" \
            python -c 'import os; from datetime import datetime, timedelta, timezone; from azure.storage.fileshare import AccountSasPermissions, ResourceTypes, Services, generate_account_sas; print(generate_account_sas(account_name=os.environ["STORAGE_ACCOUNT"], account_key=os.environ["STORAGE_KEY"], resource_types=ResourceTypes(container=True, object=True), permission=AccountSasPermissions(write=True, create=True, list=True), expiry=datetime.now(timezone.utc) + timedelta(hours=1), services=Services(fileshare=True), protocol="https"))')
          az storage share create \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" \
            --name "$RECOVERY_SHARE" \
            --output none
          azcopy copy \
            "https://${STORAGE_ACCOUNT}.file.core.windows.net/${SOURCE_SHARE}?sharesnapshot=${QDRANT_SNAPSHOT}&${SOURCE_SAS}" \
            "https://${STORAGE_ACCOUNT}.file.core.windows.net/${RECOVERY_SHARE}?${DESTINATION_SAS}" \
            --recursive=true \
            --log-level=ERROR

      - name: Validate recovered resources
        shell: bash
        run: |
          set -euo pipefail
          az postgres flexible-server show \
            --resource-group "$RECOVERY_RESOURCE_GROUP" \
            --name "$RECOVERY_POSTGRES_SERVER" \
            --query '{name:name,version:version,state:state}' -o json \
            > artifacts/recovered-postgres.json
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query '[0].value' -o tsv)
          az storage share show \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" \
            --name "$RECOVERY_SHARE" \
            --query '{name:name,quota:quota}' -o json \
            > artifacts/recovered-qdrant-share.json
          jq -e --arg server "$RECOVERY_POSTGRES_SERVER" \
            '.name == $server and .state == "Ready"' \
            artifacts/recovered-postgres.json > /dev/null
          jq -e --arg share "$RECOVERY_SHARE" \
            '.name == $share' artifacts/recovered-qdrant-share.json > /dev/null

      - name: Renew Azure OIDC credentials
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate recovered PostgreSQL query
        shell: bash
        run: |
          set -euo pipefail
          az postgres flexible-server firewall-rule create \
            --resource-group "$RECOVERY_RESOURCE_GROUP" \
            --server-name "$RECOVERY_POSTGRES_SERVER" \
            --name allow-azure-services \
            --start-ip-address 0.0.0.0 \
            --end-ip-address 0.0.0.0 \
            --output none
          RECOVERY_POSTGRES_HOST=$(az postgres flexible-server show \
            --resource-group "$RECOVERY_RESOURCE_GROUP" \
            --name "$RECOVERY_POSTGRES_SERVER" \
            --query fullyQualifiedDomainName -o tsv)
          DATABASE_URL=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name database-url \
            --query value -o tsv)
          python -m pip install --quiet "psycopg[binary]"
          DATABASE_URL="$DATABASE_URL" RECOVERY_POSTGRES_HOST="$RECOVERY_POSTGRES_HOST" \
            python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          import psycopg

          source_url = urlsplit(os.environ["DATABASE_URL"])
          credentials, separator, _ = source_url.netloc.rpartition("@")
          if source_url.scheme not in {"postgres", "postgresql"} or not separator:
              raise SystemExit("database-url must be a PostgreSQL URL with credentials")

          recovery_url = urlunsplit(
              (
                  source_url.scheme,
                  f"{credentials}@{os.environ['RECOVERY_POSTGRES_HOST']}",
                  source_url.path,
                  source_url.query,
                  source_url.fragment,
              )
          )
          with psycopg.connect(recovery_url, connect_timeout=30) as connection:
              result = connection.execute("SELECT 1").fetchone()
          if result != (1,):
              raise SystemExit("PostgreSQL connectivity query returned an unexpected result")
          PY
          unset DATABASE_URL
          echo "POSTGRES_CONNECTIVITY_VALIDATED=true" >> "$GITHUB_ENV"

      - name: Validate recovered Qdrant collections
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY_QDRANT_APP="qdrant-recovery-${GITHUB_RUN_ID}"
          RECOVERY_QDRANT_STORAGE="qdrant-recovery-${GITHUB_RUN_ID}"
          {
            echo "RECOVERY_QDRANT_APP=$RECOVERY_QDRANT_APP"
            echo "RECOVERY_QDRANT_STORAGE=$RECOVERY_QDRANT_STORAGE"
          } >> "$GITHUB_ENV"
          SOURCE_QDRANT_CONFIGURATION=$(az containerapp show --resource-group "$RESOURCE_GROUP" \
            --name usiedu-qdrant \
            --query '{fqdn:properties.configuration.ingress.fqdn,environment:properties.managedEnvironmentId}' \
            -o json)
          SOURCE_QDRANT_FQDN=$(jq -r '.fqdn' <<< "$SOURCE_QDRANT_CONFIGURATION")
          MANAGED_ENVIRONMENT=$(jq -r '.environment | split("/") | last' <<< "$SOURCE_QDRANT_CONFIGURATION")
          test -n "$SOURCE_QDRANT_FQDN"
          test -n "$MANAGED_ENVIRONMENT"
          echo "MANAGED_ENVIRONMENT=$MANAGED_ENVIRONMENT" >> "$GITHUB_ENV"
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query '[0].value' -o tsv)
          az containerapp env storage set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$MANAGED_ENVIRONMENT" \
            --storage-name "$RECOVERY_QDRANT_STORAGE" \
            --access-mode ReadWrite \
            --azure-file-account-name "$STORAGE_ACCOUNT" \
            --azure-file-account-key "$STORAGE_KEY" \
            --azure-file-share-name "$RECOVERY_SHARE" \
            --output none
          echo "QDRANT_ENV_STORAGE_CONFIGURED=true" >> "$GITHUB_ENV"
          az deployment group create \
            --resource-group "$RECOVERY_RESOURCE_GROUP" \
            --name "qdrant-recovery-validation-${GITHUB_RUN_ID}" \
            --template-file infra/azure/recovery-qdrant-validation.bicep \
            --parameters \
              appName="$RECOVERY_QDRANT_APP" \
              managedEnvironmentId="$(az containerapp env show --resource-group "$RESOURCE_GROUP" --name "$MANAGED_ENVIRONMENT" --query id -o tsv)" \
              environmentStorageName="$RECOVERY_QDRANT_STORAGE" \
              sourceQdrantFqdn="$SOURCE_QDRANT_FQDN" \
            --output none
          for attempt in $(seq 1 36); do
            marker=$(az containerapp logs show --resource-group "$RECOVERY_RESOURCE_GROUP" \
              --name "$RECOVERY_QDRANT_APP" --container validator --tail 100 --format text \
              2>/dev/null | grep 'QDRANT_RECOVERY_VALIDATION=' | tail -n 1 || true)
            if [ -n "$marker" ]; then
              break
            fi
            sleep 10
          done
          test -n "${marker:-}"
          printf '%s\n' "$marker" | sed 's/.*QDRANT_RECOVERY_VALIDATION=//' \
            > artifacts/recovered-qdrant-runtime.json
          jq -e '
            .validated == true and
            .source_collection_count == .recovery_collection_count and
            .source_collections_sha256 == .recovery_collections_sha256
          ' artifacts/recovered-qdrant-runtime.json > /dev/null
          echo "QDRANT_COLLECTIONS_VALIDATED=true" >> "$GITHUB_ENV"

      - name: Write recovery evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg github_sha "$GITHUB_SHA" \
            --arg workflow_run "$GITHUB_RUN_ID" \
            --arg source_postgres_server "$SOURCE_POSTGRES_SERVER" \
            --arg recovery_postgres_server "$RECOVERY_POSTGRES_SERVER" \
            --arg source_share "$SOURCE_SHARE" \
            --arg recovery_share "${RECOVERY_SHARE:-}" \
            --arg qdrant_snapshot "${QDRANT_SNAPSHOT:-}" \
            --arg restore_started_at "${RESTORE_STARTED_AT:-}" \
            --arg restore_completed_at "${RESTORE_COMPLETED_AT:-}" \
            --arg postgresql_connectivity_validated "${POSTGRES_CONNECTIVITY_VALIDATED:-false}" \
            --arg qdrant_collections_validated "${QDRANT_COLLECTIONS_VALIDATED:-false}" \
            '{
              schema_version: "1.0.0",
              github_sha: $github_sha,
              workflow_run: $workflow_run,
              source_postgres_server: $source_postgres_server,
              recovery_postgres_server: $recovery_postgres_server,
              source_share: $source_share,
              recovery_share: $recovery_share,
              qdrant_snapshot: $qdrant_snapshot,
              restore_started_at: $restore_started_at,
              restore_completed_at: $restore_completed_at,
              postgresql_connectivity_validated: ($postgresql_connectivity_validated == "true"),
              qdrant_collections_validated: ($qdrant_collections_validated == "true"),
              rpo_target_hours: 24,
              rto_target_hours: 4
            }' > artifacts/recovery-evidence.json

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-recovery-evidence
          path: artifacts/
          if-no-files-found: error

      - name: Clean up isolated recovery resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$RECOVERY_POSTGRES_SERVER" != "$SOURCE_POSTGRES_SERVER"
          RECOVERY_QDRANT_APP_EXISTS=$(az containerapp list \
            --resource-group "$RECOVERY_RESOURCE_GROUP" \
            --query "[?name=='${RECOVERY_QDRANT_APP:-}'].name | [0]" -o tsv)
          if [ -n "$RECOVERY_QDRANT_APP_EXISTS" ]; then
            az containerapp delete --resource-group "$RECOVERY_RESOURCE_GROUP" \
              --name "$RECOVERY_QDRANT_APP" --yes --output none
          fi
          if [ -n "${MANAGED_ENVIRONMENT:-}" ]; then
            RECOVERY_QDRANT_STORAGE_EXISTS=$(az containerapp env storage list \
              --resource-group "$RESOURCE_GROUP" --name "$MANAGED_ENVIRONMENT" \
              --query "[?name=='${RECOVERY_QDRANT_STORAGE:-}'].name | [0]" -o tsv)
            if [ "$RECOVERY_QDRANT_STORAGE_EXISTS" = "${RECOVERY_QDRANT_STORAGE:-}" ]; then
              az containerapp env storage remove --resource-group "$RESOURCE_GROUP" \
                --name "$MANAGED_ENVIRONMENT" --storage-name "$RECOVERY_QDRANT_STORAGE" \
                --yes --output none
            fi
          fi
          RECOVERY_SERVER_EXISTS=$(az postgres flexible-server list \
            --resource-group "$RECOVERY_RESOURCE_GROUP" \
            --query "[?name=='${RECOVERY_POSTGRES_SERVER}'].name | [0]" -o tsv)
          if [ -n "$RECOVERY_SERVER_EXISTS" ]; then
            az postgres flexible-server delete --resource-group "$RECOVERY_RESOURCE_GROUP" \
              --name "$RECOVERY_POSTGRES_SERVER" --yes --output none
          fi
          if [ -n "${RECOVERY_SHARE:-}" ]; then
            az storage share-rm delete --resource-group "$RESOURCE_GROUP" \
              --storage-account "$STORAGE_ACCOUNT" --name "$RECOVERY_SHARE" \
              --yes --output none
          fi
          if [ -n "${QDRANT_SNAPSHOT:-}" ]; then
            az storage share-rm delete --resource-group "$RESOURCE_GROUP" \
              --storage-account "$STORAGE_ACCOUNT" --name "$SOURCE_SHARE" \
              --snapshot "$QDRANT_SNAPSHOT" --yes --output none
          fi
