name: Configure Azure operational alerts

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOG_ANALYTICS_WORKSPACE: ${{ vars.AZURE_LOG_ANALYTICS_WORKSPACE }}
      POSTGRES_SERVER: ${{ vars.AZURE_POSTGRES_SERVER }}
      INGEST_JOB: ${{ vars.AZURE_INGEST_JOB }}
    steps:
      - name: Checkout approved templates
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy approved technical alerts
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "operational-alerts-${GITHUB_RUN_ID}" \
            --template-file infra/azure/monitoring-alerts.bicep \
            --parameters \
              logAnalyticsWorkspaceName="$LOG_ANALYTICS_WORKSPACE" \
              postgresServerName="$POSTGRES_SERVER" \
              ingestJobName="$INGEST_JOB" \
            --output none

      - name: Validate alert resources
        shell: bash
        run: |
          set -euo pipefail
          for alert in \
            "Microsoft.Insights/scheduledQueryRules/usiedu-containerapp-tracebacks" \
            "Microsoft.Insights/scheduledQueryRules/usiedu-ingest-failed" \
            "Microsoft.Insights/metricAlerts/usiedu-postgresql-unavailable"; do
            az resource show --resource-group "$RESOURCE_GROUP" \
              --resource-type "${alert%/*}" --name "${alert##*/}" \
              --query '{id:id,name:name,type:type,provisioningState:properties.provisioningState}' \
              -o json
          done > artifacts/operational-alert-resources.json
          jq -e '
            length == 3 and
            all(.[]; .id and .name and .type)
          ' <(jq -s '.' artifacts/operational-alert-resources.json) > /dev/null

      - name: Upload alert resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-operational-alert-resources
          path: artifacts/operational-alert-resources.json
          if-no-files-found: error
