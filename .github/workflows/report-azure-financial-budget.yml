name: Report Azure financial budget

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      BUDGET_NAME: usiedu-monthly-budget
      BUDGET_AMOUNT_BRL: "30"
      FINANCIAL_ALERT_LABEL: azure-financial-alert
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout approved runbook
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Query approved monthly budget
        shell: bash
        run: |
          set -euo pipefail
          az rest --method get \
            --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Consumption/budgets/${BUDGET_NAME}?api-version=2023-05-01" \
            | jq '{
                budget_name: .name,
                amount: .properties.amount,
                currency: .properties.currentSpend.unit,
                current_spend: .properties.currentSpend.amount,
                month_start: .properties.timePeriod.startDate
              }' > artifacts/financial-budget-status.json
          jq -e \
            --arg name "$BUDGET_NAME" \
            --argjson amount "$BUDGET_AMOUNT_BRL" '
              .budget_name == $name and
              .amount == $amount and
              .currency == "BRL"
            ' artifacts/financial-budget-status.json > /dev/null

      - name: Create or update financial budget issues
        shell: bash
        run: |
          set -euo pipefail
          gh label create "$FINANCIAL_ALERT_LABEL" --color b60205 \
            --description "Azure financial budget threshold reached" --force
          current_spend=$(jq -r '.current_spend' artifacts/financial-budget-status.json)
          for threshold in 80 100; do
            if ! awk -v spend="$current_spend" -v budget="$BUDGET_AMOUNT_BRL" -v threshold="$threshold" \
              'BEGIN { exit !(spend * 100 >= budget * threshold) }'; then
              continue
            fi
            title="[Azure Cost] ${RESOURCE_GROUP} >= ${threshold}%"
            body=$(jq -n \
              --arg resource_group "$RESOURCE_GROUP" \
              --arg budget_name "$BUDGET_NAME" \
              --arg threshold "$threshold" \
              --slurpfile budget artifacts/financial-budget-status.json \
              '{
                resource_group: $resource_group,
                budget_name: $budget_name,
                threshold_percent: ($threshold | tonumber),
                currency: $budget[0].currency,
                budget_amount: $budget[0].amount,
                current_spend: $budget[0].current_spend,
                month_start: $budget[0].month_start
              }')
            issue_number=$(gh issue list --state open --label "$FINANCIAL_ALERT_LABEL" \
              --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
            if [[ -z "$issue_number" ]]; then
              gh issue create --title "$title" --label "$FINANCIAL_ALERT_LABEL" --body "$body"
            else
              gh issue comment "$issue_number" --body "$body"
            fi
          done

      - name: Upload sanitized budget evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-financial-budget-evidence
          path: artifacts/financial-budget-status.json
          if-no-files-found: error
