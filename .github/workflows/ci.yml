name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest -v --tb=short

      - name: Exercise RAG regression gate
        run: |
          python -m src.evaluation.regression_gate \
            --baseline src/evaluation/regression_fixtures/baseline.json \
            --candidate src/evaluation/regression_fixtures/candidate.json \
            --policy src/evaluation/regression_policy_v1.json \
            --output artifacts/rag-regression-report.json

      - name: Upload RAG regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-regression-evidence
          path: artifacts/rag-regression-report.json
          if-no-files-found: error
