version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: usiedu-api
    ports:
      - "8000:8000"
    environment:
      - USIEDU_ROUTER_MODEL=${USIEDU_ROUTER_MODEL:-deepseek-v4-flash}
      - USIEDU_AGENT_MODEL=${USIEDU_AGENT_MODEL:-deepseek-v4-flash}
      - USIEDU_JWT_SECRET=${USIEDU_JWT_SECRET:-chave-docker-piloto}
    volumes:
      - checkpoints:/app/checkpoints
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: usiedu-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: usiedu-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  checkpoints:
    driver: local
  qdrant_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./qdrant_storage
  qdrant_snapshots:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./qdrant_snapshots
