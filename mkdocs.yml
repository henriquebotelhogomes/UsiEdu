site_name: UsiEdu — Documentação Técnica
site_description: Plataforma multi-agente de IA conversacional para educação
site_url: https://henriquebotelhogomes.github.io/UsiEdu/
repo_url: https://github.com/henriquebotelhogomes/UsiEdu
repo_name: UsiEdu

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy

nav:
  - Início: index.md
  - Visão Geral:
    - Arquitetura: 01-visao-geral-arquitetura.md
    - Agentes e Orquestração: 02-agentes-e-orquestracao.md
    - RAG e Infraestrutura: 03-rag-e-infraestrutura.md
  - Piloto:
    - Piloto e Roadmap: 04-piloto-e-roadmap.md
    - Fontes da Base de Conhecimento: 05-fontes-base-conhecimento.md
    - Visão de Escala Global: 06-visao-escala-global.md
  - Requisitos e Contratos:
    - PRD: 07-prd-requisitos.md
    - Plano de Execução: 08-plano-execucao.md
    - Contratos Técnicos: 09-contratos-tecnicos.md
  - Avaliação:
    - Roteiro de Vídeo Demo: 10-roteiro-video-demo.md
  - Operação:
    - Programa de Profissionalização: profissionalizacao/README.md
    - PRD do Programa: profissionalizacao/00-prd-programa.md
    - Validação do Piloto Público: profissionalizacao/01-validacao-piloto.md
    - Qualidade RAG: profissionalizacao/02-qualidade-rag.md
    - Integração, Entrega e Rollback: profissionalizacao/03-integracao-entrega-rollback.md
    - Segurança Operacional: profissionalizacao/04-seguranca-operacional.md
    - Performance e Disponibilidade: profissionalizacao/05-performance-disponibilidade.md
    - Produto e Experiência: profissionalizacao/06-produto-experiencia.md
    - Decisões Provisórias do Piloto: profissionalizacao/07-decisoes-provisorias.md
    - Template de Iniciativa: profissionalizacao/TEMPLATE_INICIATIVA.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/henriquebotelhogomes
