[project]
name = "usiedu"
version = "0.1.0"
description = "Plataforma multi-agente de IA conversacional para educação"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Henrique Botelho Gomes" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-jose[cryptography]>=3.3.0",
    "PyJWT>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langsmith>=0.3.0",
    "qdrant-client>=1.13.0",
    "fastembed>=0.6.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.25.0",
    "trafilatura>=2.0.0",
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.9",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff==0.16.5",
    "mkdocs-material>=9.5.0",
    "msgpack>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Scripts executáveis carregam .env antes de importar módulos do projeto
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: testes que requerem serviços externos (Qdrant, etc.)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "src/evaluation/*",
    "src/observability/performance_baseline.py",
    "src/delivery/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

